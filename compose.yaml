name: minecraft-management
services:
  crafty:
    image: ${CRAFTY_IMAGE:-arcadiatechnology/crafty-4:4.11.0@sha256:7b6e87514259549647e15ceeaf73d238792e6d77e2c79fc744d5badc8d6e997c}
    container_name: crafty-controller
    restart: unless-stopped
    stop_grace_period: 3m
    environment:
      TZ: Europe/Zagreb
    # Preserve the upstream root wrapper -> crafty service-user transition.
    # These are needed for mount preparation and sudo's user/group transition.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    mem_limit: ${CRAFTY_MEMORY_LIMIT:-4g}
    ports:
      - "127.0.0.1:${CRAFTY_PORT:-8443}:8443/tcp"
    volumes:
      - ./runtime/backups:/crafty/backups
      - ./runtime/logs:/crafty/logs
      - ./runtime/servers:/crafty/servers
      - ./runtime/config:/crafty/app/config
      - ./runtime/import:/crafty/import
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, python3, -c, "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/login',context=ssl._create_unverified_context(),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
